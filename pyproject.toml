[project]
name = "apple-intune-baseline"
version = "0.1.0"
description = "MCP server that turns mSCP baselines into Intune policies and custom compliance"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
  "mcp>=2.3,<3",
  "pyyaml>=6",
  "msal>=1.31",
  "msal-extensions>=1.2",
  "httpx>=0.27",
  "reportlab>=4.2",
  "mscp @ git+https://github.com/usnistgov/macos_security@release_27.0",
]

[project.scripts]
apple-intune-baseline = "apple_intune_baseline.server:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-xdist>=3.6", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/apple_intune_baseline"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Pyflakes and the syntax-level pycodestyle checks: mistakes, not style.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
markers = ["slow: runs mSCP scripts for whole baselines; left out of the pre-commit hook"]
